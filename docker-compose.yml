version: "3.9"

services:
  # ─── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: djs-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-djs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-djs_secret}
      POSTGRES_DB: ${POSTGRES_DB:-distributed_job_scheduler}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-djs_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: djs-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Backend API ───────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: djs-api
    command: >
      uvicorn src.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-djs_user}:${POSTGRES_PASSWORD:-djs_secret}@postgres:5432/${POSTGRES_DB:-distributed_job_scheduler}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-djs_user}:${POSTGRES_PASSWORD:-djs_secret}@postgres:5432/${POSTGRES_DB:-distributed_job_scheduler}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-key-change-in-production}
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Worker Process ────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: djs-worker
    command: python -m src.workers.engine
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-djs_user}:${POSTGRES_PASSWORD:-djs_secret}@postgres:5432/${POSTGRES_DB:-distributed_job_scheduler}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-djs_user}:${POSTGRES_PASSWORD:-djs_secret}@postgres:5432/${POSTGRES_DB:-distributed_job_scheduler}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-key-change-in-production}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      WORKER_QUEUES: ${WORKER_QUEUES:-default}
      ENVIRONMENT: development
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Frontend ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: djs-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
